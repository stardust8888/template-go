# Kafka 配置（github.com/IBM/sarama）
[kafka]
version = "3.0.0"

[kafka.producer_message]
brokers = ["127.0.0.1:9092"]
topic = "message_push"
async = false            # true=异步生产者(不等确认即返回)；false=同步等待确认
required_backs = 1       # -1=all(所有 ISR)，1=leader，0=none

[kafka.consumer_message_push]
brokers = ["127.0.0.1:9092"]
topic = "message_push"
group_id = "message-push-consumer"
start_offset = -2        # -2=earliest，-1=latest
commit_interval = 5000   # 自动提交间隔(ms)，0=手动(由 session 结束提交)

[kafka.consumer_message_save]
brokers = ["127.0.0.1:9092"]
topic = "message_save"
group_id = "message-save-consumer"
start_offset = -2
commit_interval = 5000